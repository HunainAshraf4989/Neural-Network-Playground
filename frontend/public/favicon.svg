<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="nn-architect">
  <!-- A three-node network fanning out, the smallest shape that still reads as
       "neural net" at 16px. Colours are the canvas palette (styles.css): dark
       slate plate so it holds up on both light and dark tab bars, blue edges,
       and a green input node fanning into two blue ones. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd49b"/>
      <stop offset="1" stop-color="#4a7ce0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0d1220"/>

  <g stroke="url(#edge)" stroke-width="2.4" stroke-linecap="round">
    <line x1="10" y1="16" x2="22" y2="9.5"/>
    <line x1="10" y1="16" x2="22" y2="22.5"/>
  </g>

  <circle cx="10" cy="16" r="3.6" fill="#2bd49b"/>
  <circle cx="22" cy="9.5" r="3.4" fill="#5b8def"/>
  <circle cx="22" cy="22.5" r="3.4" fill="#4a7ce0"/>
</svg>
