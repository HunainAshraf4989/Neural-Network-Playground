name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
      - name: Backend tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The catalog-parity test shells out to $PYTHON to import backend/layers.py
      # (stdlib only), and the ws e2e suite boots the real backend — so the
      # frontend job also needs the backend's deps.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Frontend unit tests (incl. catalog parity)
        run: npx vitest run
        working-directory: frontend
      - name: Frontend e2e protocol tests (live backend)
        run: npm run test:e2e
        working-directory: frontend
